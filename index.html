<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Web-to-APK & Fullscreen Mobile App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#38bdf8">
    <title>Toddler Bubble Pop</title>
    <!-- Load Tailwind CSS for responsive layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Tone.js for gentle, cheerful musical chimes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Load Fredoka font for big, friendly letters -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Prevent scrolling, zooming, or accidental text selection for little fingers */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 50%, #dcfce7 100%);
        }

        /* Fullscreen interactive canvas */
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* Gentle bounce for the sun and clouds */
        @keyframes slowFloat {
            0%, 100% { transform: translateY(0px); }
        /* Sound Toggle Button (Large target for parents) */
        <div class="flex items-center gap-2 pointer-events-auto">
            <button id="soundBtn" onclick="toggleSound(event)" class="bg-white/90 active:scale-90 transition-transform p-3 rounded-full shadow-lg border-4 border-sky-300 text-2xl sm:text-3xl" aria-label="Toggle Sound">
                🔊
            </button>
            <!-- Parent-Only Hold-to-Exit Lock Button -->
            <button id="exitLockBtn" 
                onmousedown="startExitHold(event)" 
                onmouseup="cancelExitHold(event)" 
                onmouseleave="cancelExitHold(event)"
                ontouchstart="startExitHold(event)" 
                ontouchend="cancelExitHold(event)"
                ontouchcancel="cancelExitHold(event)"
                class="relative overflow-hidden bg-rose-500 text-white font-bold px-4 py-3 rounded-full shadow-lg border-4 border-rose-300 text-sm sm:text-base select-none" 
                aria-label="Hold 3 seconds to Exit Lock">
                <span id="exitProgress" class="absolute inset-0 bg-rose-800/60 w-0 pointer-events-none transition-none"></span>
                <span class="relative z-10 flex items-center gap-1">🔒 Hold to Exit</span>
            </button>
        </div>
    </div>

    <!-- Subtle Parent Toast Message (Replaces browser alerts) -->
    <div id="parentToast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-5 py-2.5 rounded-full text-sm sm:text-base font-bold shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 z-30 text-center max-w-[90vw]">
        Hold "Exit" for 3 seconds to unlock
    </div>

    <!-- Main Interactive Play Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Friendly Start Overlay (Helps unlock audio on mobile devices with one big tap) -->
    <div id="startScreen" onclick="startPlay()" class="absolute inset-0 bg-sky-400/80 backdrop-blur-sm flex flex-col items-center justify-center z-20 cursor-pointer p-6 text-center">
        <div class="bg-white rounded-[3rem] p-8 sm:p-12 shadow-2xl border-8 border-yellow-300 max-w-md w-full transform transition-transform active:scale-95">
            <div class="text-7xl sm:text-8xl mb-4 animate-bounce">🫧🐶🫧</div>
            <h1 class="text-4xl sm:text-5xl font-bold text-sky-600 mb-3">Bubble Pop!</h1>
            <p class="text-xl sm:text-2xl text-slate-600 mb-6">Tap anywhere to play!</p>
            <div class="bg-emerald-500 text-white text-3xl sm:text-4xl font-bold py-5 px-8 rounded-full shadow-lg border-b-8 border-emerald-700">
                ▶️ PLAY
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           TODDLER BUBBLE POP - DESIGNED FOR 2-YEAR-OLDS
           - No losing, no timers, no stressful sounds
           - Giant hitboxes (easy for small fingers)
           - Multi-touch support (can tap with whole hand!)
           - Tapping empty space also creates fun bubbles & stars!
           ========================================================================== */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const starCountEl = document.getElementById('starCount');
        const startScreen = document.getElementById('startScreen');
        const soundBtn = document.getElementById('soundBtn');
        const exitProgress = document.getElementById('exitProgress');
        const parentToast = document.getElementById('parentToast');

        let width = window.innerWidth;
        let height = window.innerHeight;
        let starsCollected = 0;
        let soundEnabled = true;
        let gameStarted = false;
        let isToddlerLocked = false;
        let exitHoldTimer = null;
        let exitAnimFrame = null;

        // Arrays to hold active bubbles, floating animals, and colorful confetti stars
        let bubbles = [];
        let floatingAnimals = [];
        let particles = [];

        // Cute, recognizable animals and objects for a 2-year-old
        const toddlerFriends = [
            '🐶', '🐱', '🐰', '🐻', '🐼', '🦁', '🐸', '🐷',
            '🐮', '🐵', '🐥', '🦆', '🐢', '🐠', '🦋', '🐞',
            '🚗', '🚂', '🎈', '🍎', '🍌', '🍓', '🌟', '🌈'
        ];

        // Bright, cheerful pastel & primary bubble colors
        const bubbleColors = [
            { fill: 'rgba(255, 107, 107, 0.45)', stroke: '#ff6b6b' }, // Coral Red
            { fill: 'rgba(78, 205, 196, 0.45)', stroke: '#4ecdc4' },  // Turquoise
            { fill: 'rgba(255, 217, 61, 0.50)', stroke: '#f59e0b' },  // Sunny Yellow
            { fill: 'rgba(107, 91, 149, 0.40)', stroke: '#8b5cf6' },  // Soft Purple
            { fill: 'rgba(255, 159, 243, 0.45)', stroke: '#ec4899' }, // Bubblegum Pink
            { fill: 'rgba(84, 160, 255, 0.45)', stroke: '#3b82f6' }   // Sky Blue
        ];

        /* ==========================================================================
           GENTLE AUDIO ENGINE (Pentatonic Scale - Always sounds sweet!)
           ========================================================================== */
        let synth = null;
        // C Major Pentatonic notes (no matter what order they play, it always sounds harmonious!)
        const happyNotes = ['C4', 'D4', 'E4', 'G4', 'A4', 'C5', 'D5', 'E5'];

        function initAudio() {
            if (!synth && typeof Tone !== 'undefined') {
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'sine' }, // Soft, warm flute/bell tone
                    envelope: {
                        attack: 0.02,
                        decay: 0.2,
                        sustain: 0.1,
                        release: 0.8
                    }
                }).toDestination();
                synth.volume.value = -6; // Gentle volume for little ears
            }
            if (Tone.context.state !== 'running') {
                Tone.start();
            }
        }

        function playHappyChime() {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (synth) {
                    const note = happyNotes[Math.floor(Math.random() * happyNotes.length)];
                    synth.triggerAttackRelease(note, '8n');
                }
            } catch (e) {
                // Ignore if audio isn't unlocked yet
            }
        }

        function toggleSound(e) {
            e.stopPropagation();
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) playHappyChime();
        }

        /* ==========================================================================
           CANVAS RESIZING & INITIALIZATION
           ========================================================================== */
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        function startPlay() {
            gameStarted = true;
            isToddlerLocked = true;
            startScreen.style.display = 'none';
            initAudio();
            playHappyChime();
            enterKioskFullscreen();
            
            // Spawn initial batch of giant bubbles
            for (let i = 0; i < 6; i++) {
                spawnBubble(
                    Math.random() * (width - 160) + 80,
                    Math.random() * (height - 160) + 80
                );
            }
        }

        /* ==========================================================================
           TODDLER LOCK / KIOSK FULLSCREEN & PARENT HOLD-TO-EXIT
           ========================================================================== */
        function showParentToast(msg) {
            parentToast.textContent = msg;
            parentToast.style.opacity = '1';
            clearTimeout(parentToast._hideTimeout);
            parentToast._hideTimeout = setTimeout(() => {
                parentToast.style.opacity = '0';
            }, 2500);
        }

        function enterKioskFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }
            // Trap Android Back Button using History API
            window.history.pushState({ locked: true }, '');
        }

        // Prevent accidental back navigation while Toddler Lock is active
        window.addEventListener('popstate', () => {
            if (isToddlerLocked) {
                window.history.pushState({ locked: true }, '');
                showParentToast('🔒 Toddler Lock Active: Hold "Hold to Exit" for 3s');
            }
        });

        // Re-engage fullscreen if user swipes status bar while still locked
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && isToddlerLocked) {
                showParentToast('🔒 Tap screen to re-lock fullscreen or Hold Exit for 3s');
            }
        });

        // Re-lock fullscreen on any screen tap if exited accidentally
        canvas.addEventListener('pointerdown', () => {
            if (isToddlerLocked && !document.fullscreenElement) {
                enterKioskFullscreen();
            }
        });

        function startExitHold(e) {
            e.stopPropagation();
            if (e.cancelable) e.preventDefault();
            
            const holdDuration = 3000; // 3 seconds hold required for parents
            const startTime = performance.now();
            showParentToast('Keep holding for 3 seconds to exit...');

            function updateProgress(now) {
                const elapsed = now - startTime;
                const pct = Math.min(100, (elapsed / holdDuration) * 100);
                exitProgress.style.width = `${pct}%`;

                if (pct >= 100) {
                    unlockAndExit();
                } else {
                    exitAnimFrame = requestAnimationFrame(updateProgress);
                }
            }
            exitAnimFrame = requestAnimationFrame(updateProgress);
        }

        function cancelExitHold(e) {
            if (e) e.stopPropagation();
            cancelAnimationFrame(exitAnimFrame);
            exitProgress.style.width = '0%';
        }

        function unlockAndExit() {
            isToddlerLocked = false;
            gameStarted = false;
            exitProgress.style.width = '0%';
            
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }
            // Return to start screen so parent can safely close or switch apps
            startScreen.style.display = 'flex';
            showParentToast('🔓 Toddler Lock Unlocked! Safe to exit.');
        }

        /* ==========================================================================
           BUBBLE, ANIMAL & CONFETTI CLASSES
           ========================================================================== */
        function spawnBubble(x, y, isExtraLarge = false) {
            // Giant radius (65px to 95px) so a 2-year-old can easily tap it
            const baseRadius = Math.min(width, height) * 0.11;
            const radius = Math.max(60, Math.min(100, baseRadius)) + (isExtraLarge ? 15 : Math.random() * 20);
            
            const color = bubbleColors[Math.floor(Math.random() * bubbleColors.length)];
            const emoji = toddlerFriends[Math.floor(Math.random() * toddlerFriends.length)];

            bubbles.push({
                x: x !== undefined ? x : Math.random() * (width - radius * 2) + radius,
                y: y !== undefined ? y : height + radius,
                radius: radius,
                vx: (Math.random() - 0.5) * 1.2, // Very slow horizontal drift
                vy: -(Math.random() * 1.2 + 0.8), // Very gentle upward float
                wobblePhase: Math.random() * Math.PI * 2,
                color: color,
                emoji: emoji,
                scale: 0.1 // Pop-in animation
            });
        }

        function popBubble(bubble, index) {
            // Remove bubble
            bubbles.splice(index, 1);

            // Play sweet musical chime
            playHappyChime();

            // Increment star counter
            starsCollected++;
            starCountEl.textContent = starsCollected;

            // Create a happy jumping animal where the bubble popped
            floatingAnimals.push({
                x: bubble.x,
                y: bubble.y,
                vy: -4,
                emoji: bubble.emoji,
                scale: 1,
                alpha: 1
            });

            // Create burst of colorful confetti stars & mini bubbles
            const burstColors = ['#ff6b6b', '#ffd93d', '#4ecdc4', '#ff9ff3', '#54a0ff', '#1dd1a1'];
            for (let i = 0; i < 16; i++) {
                const angle = (Math.PI * 2 * i) / 16;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x: bubble.x,
                    y: bubble.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 12 + 8,
                    color: burstColors[i % burstColors.length],
                    alpha: 1,
                    isStar: i % 2 === 0
                });
            }
        }

        /* ==========================================================================
           MULTI-TOUCH & MOUSE INTERACTION (Tapping anywhere is rewarding!)
           ========================================================================== */
        function handleTap(clientX, clientY) {
            if (!gameStarted) return;

            let hitABubble = false;

            // Check backwards so top bubbles get popped first
            // Add generous +25px extra padding around hitbox for little fingers!
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                const dx = clientX - b.x;
                const dy = clientY - b.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist <= b.radius + 25) {
                    popBubble(b, i);
                    hitABubble = true;
                    break; // Pop one bubble per finger touch
                }
            }

            // If toddler taps empty sky, spawn a brand new giant bubble right under their finger!
            if (!hitABubble) {
                playHappyChime();
                if (bubbles.length < 10) {
                    spawnBubble(clientX, clientY, true);
                }
                // Little sparkle at finger tip
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI * 2 * i) / 6;
                    particles.push({
                        x: clientX,
                        y: clientY,
                        vx: Math.cos(angle) * 3,
                        vy: Math.sin(angle) * 3,
                        size: 10,
                        color: '#ffd93d',
                        alpha: 1,
                        isStar: true
                    });
                }
            }
        }

        // Support multi-touch (toddlers often slap the screen with multiple fingers!)
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                handleTap(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        // Support mouse clicks
        canvas.addEventListener('mousedown', (e) => {
            handleTap(e.clientX, e.clientY);
        });

        /* ==========================================================================
           DRAWING HELPERS
           ========================================================================== */
        function drawStar(cx, cy, spikes, outerRadius, innerRadius, color, alpha) {
            let rot = (Math.PI / 2) * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
        }

        function drawBackgroundHills() {
            // Soft rolling green hills at the bottom for a cozy storybook feel
            ctx.fillStyle = '#86efac';
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height - 80);
            ctx.quadraticCurveTo(width * 0.25, height - 140, width * 0.5, height - 70);
            ctx.quadraticCurveTo(width * 0.75, height - 10, width, height - 90);
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#4ade80';
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height - 45);
            ctx.quadraticCurveTo(width * 0.4, height - 10, width * 0.7, height - 60);
            ctx.quadraticCurveTo(width * 0.9, height - 85, width, height - 40);
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();
        }

        /* ==========================================================================
           MAIN ANIMATION LOOP
           ========================================================================== */
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Draw cute hills at bottom
            drawBackgroundHills();

            // Keep 6 to 7 giant bubbles floating on screen automatically
            if (gameStarted && bubbles.length < 6 && Math.random() < 0.04) {
                spawnBubble();
            }

            // 1. Update & Draw Bubbles
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                
                // Smooth pop-in growth
                if (b.scale < 1) {
                    b.scale = Math.min(1, b.scale + 0.08);
                }

                // Gentle floating movement
                b.wobblePhase += 0.03;
                b.x += b.vx + Math.sin(b.wobblePhase) * 0.6;
                b.y += b.vy;

                // Keep bubbles bouncing gently off left/right walls so they stay on screen
                if (b.x - b.radius < 10) {
                    b.x = b.radius + 10;
                    b.vx = Math.abs(b.vx);
                } else if (b.x + b.radius > width - 10) {
                    b.x = width - b.radius - 10;
                    b.vx = -Math.abs(b.vx);
                }

                // If bubble floats off the top, wrap it gently back to the bottom
                if (b.y + b.radius < -20) {
                    b.y = height + b.radius;
                    b.x = Math.random() * (width - b.radius * 2) + b.radius;
                }

                const currentRadius = b.radius * b.scale;

                ctx.save();
                // Bubble body
                ctx.beginPath();
                ctx.arc(b.x, b.y, currentRadius, 0, Math.PI * 2);
                ctx.fillStyle = b.color.fill;
                ctx.fill();
                ctx.lineWidth = 5;
                ctx.strokeStyle = b.color.stroke;
                ctx.stroke();

                // Glossy white shine highlight on top-left of bubble
                ctx.beginPath();
                ctx.arc(
                    b.x - currentRadius * 0.32,
                    b.y - currentRadius * 0.32,
                    currentRadius * 0.18,
                    0,
                    Math.PI * 2
                );
                ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                ctx.fill();

                // Cute animal/object inside the bubble
                ctx.font = `${Math.floor(currentRadius * 0.95)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(b.emoji, b.x, b.y + 4);
                ctx.restore();
            }

            // 2. Update & Draw Happy Popped Animals
            for (let i = floatingAnimals.length - 1; i >= 0; i--) {
                const anim = floatingAnimals[i];
                anim.y += anim.vy;
                anim.vy += 0.15; // Gentle hop arc
                anim.scale += 0.025;
                anim.alpha -= 0.025;

                if (anim.alpha <= 0) {
                    floatingAnimals.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = anim.alpha;
                ctx.font = `${Math.floor(85 * anim.scale)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(anim.emoji, anim.x, anim.y);
                ctx.restore();
            }

            // 3. Update & Draw Confetti & Stars
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.12; // Gentle gravity
                p.alpha -= 0.025;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                if (p.isStar) {
                    drawStar(p.x, p.y, 5, p.size, p.size * 0.45, p.color, p.alpha);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.restore();
                }
            }

            requestAnimationFrame(animate);
        }

        // Start animation loop when window loads
        window.onload = function () {
            animate();
        };
    </script>
</body>
</html>
